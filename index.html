<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Wash Studio 2</title><style>*{box-sizing:border-box}body{margin:0;background:#18252c;color:white;font:16px system-ui}canvas{display:block;touch-action:none}header,footer{position:absolute;z-index:2;left:0;right:0;padding:16px}header{top:0;pointer-events:none;background:linear-gradient(#10202bcc,transparent)}footer{bottom:0;text-align:center;background:#10202be8}button{padding:12px;border:1px solid #7795a4;border-radius:10px;background:#243d4b;color:white;font:inherit;margin:3px}button.active{background:#007e9e}h1{margin:0;font-size:23px}progress{width:220px;accent-color:#55e3b5}#status{position:absolute;top:45%;width:100%;text-align:center}small{color:#c5d9e3}</style><header><h1>CAR WASH STUDIO <small>2.0</small></h1>清潔度 <b id="pct">0%</b><br><progress id="progress" max="100" value="0"></progress></header><div id="status">載入 3D 引擎…</div><footer><button id="water" class="active">🚿 水槍</button><button id="foam">泡沫</button><button id="orbit">旋轉</button><button id="reset">重新開始</button><br><small>按住拖動清洗 · 旋轉模式查看車身 · 滾輪縮放</small></footer><script type="module">

const env=new T.Scene();env.background=new T.Color(0x9caebd);for(let i=0;i<5;i++){let m=new T.Mesh(new T.PlaneGeometry(5,3),new T.MeshBasicMaterial({color:0xffffff}));m.position.set(Math.cos(i*1.26)*5,3,Math.sin(i*1.26)*5);m.lookAt(0,0,0);env.add(m)}scene.environment=new T.PMREMGenerator(renderer).fromScene(env,.05).texture;
scene.add(new T.HemisphereLight(0xffffff,0x64717a,2));let sun=new T.DirectionalLight(0xfff4dd,3);sun.position.set(4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
let floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x65747b,roughness:.65}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const car=new T.Group();scene.add(car);const washable=[];let seed=1;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
function material(color,metal=.3,rough=.35){return new T.MeshStandardMaterial({color,metalness:metal,roughness:rough})}
const paint=material(0x416d54,.65,.24),black=material(0x161b20,.1,.75),glass=material(0x253e50,.55,.12),chrome=material(0xb9c5cb,.85,.2);
function rounded(w,h,d,r){let s=new T.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);let g=new T.ExtrudeGeometry(s,{depth:d-2*r,bevelEnabled:true,bevelSize:r*.45,bevelThickness:r,bevelSegments:3,steps:1,curveSegments:8});g.translate(0,0,-(d-2*r)/2);g.computeVertexNormals();let p=g.attributes.position,uv=[];for(let i=0;i<p.count;i++)uv.push((p.getX(i)+w/2)/w,(p.getY(i)+h/2)/h);return g}
function dirtMap(mesh,base){let c=document.createElement('canvas');c.width=c.height=512;let ctx=c.getContext('2d');let tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;let m=base.clone();m.map=tex;m.color.set(0xffffff);mesh.material=m;let dirt=document.createElement('canvas');dirt.width=dirt.height=512;let dc=dirt.getContext('2d',{willReadFrequently:true});let foam=document.createElement('canvas');foam.width=foam.height=512;let fc=foam.getContext('2d');let entry={mesh,ctx,dc,fc,tex,base:base.color.getStyle(),dirt,foam};washable.push(entry);return entry}
function add(g,m,x,y,z,wash=true){let mesh=new T.Mesh(g,m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;car.add(mesh);if(wash)dirtMap(mesh,m);return mesh}
function box(w,h,d,x,y,z,m=paint,wash=true){return add(new T.BoxGeometry(w,h,d),m,x,y,z,wash)}
function panel(w,h,d,x,y,z,m=paint){let mesh=add(rounded(w,h,d,.08),m,x,y,z,false);let g=mesh.geometry,p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;for(let i=0;i<p.count;i++){let ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));let u,v;if(az>=ax&&az>=ay){u=p.getX(i)/w+.5;v=p.getY(i)/h+.5}else if(ax>=ay){u=p.getZ(i)/d+.5;v=p.getY(i)/h+.5}else{u=p.getX(i)/w+.5;v=p.getZ(i)/d+.5}uv.setXY(i,Math.max(0,Math.min(1,u)),Math.max(0,Math.min(1,v)))}dirtMap(mesh,m);return mesh}
panel(4.6,.72,1.95,0,.94,0);panel(2.65,.85,1.79,-.55,1.69,0);panel(2.8,.13,1.9,-.55,2.15,0);panel(1.5,.15,1.91,1.5,1.36,0);
for(let s of [-1,1]){for(let i=0;i<3;i++){let x=-1.48+i*.79;box(.68,.51,.035,x,1.77,s*.91,glass);box(.69,.015,.045,x,1.48,s*.93,black,false);box(.16,.045,.045,x+.22,1.23,s*.99,chrome,false);box(.014,.58,.025,x+.36,.99,s*.99,black,false)}box(.29,.16,.25,.66,1.52,s*1.13,paint);box(.23,.12,.02,.66,1.52,s*1.26,glass,false);box(3.8,.12,.14,0,.56,s*1.02,black);for(let x of [-1.48,1.48]){let tire=add(new T.CylinderGeometry(.52,.52,.35,48),black,x,.53,s*1.02);tire.rotation.x=Math.PI/2;let rim=add(new T.CylinderGeometry(.33,.33,.045,40),chrome,x,.53,s*1.21);rim.rotation.x=Math.PI/2;for(let j=0;j<6;j++){let q=j*Math.PI/3;let spoke=box(.055,.25,.035,x+Math.sin(q)*.14,.53+Math.cos(q)*.14,s*1.24,black,false);spoke.rotation.z=-q}for(let j=0;j<40;j++){let q=j*Math.PI/20;let tread=box(.055,.025,.34,x+Math.cos(q)*.52,.53+Math.sin(q)*.52,s*1.02,black,false);tread.rotation.z=q-Math.PI/2}}}
box(.04,.53,1.6,.79,1.77,0,glass);box(.04,.53,1.6,-1.9,1.77,0,glass);for(let s of [-1,1]){box(.07,.31,.43,2.32,1.12,s*.69,material(0xf3f4e5,.3,.15));box(.07,.28,.25,-2.32,1.12,s*.75,material(0x9e1820,.3,.2));}box(.12,.35,.94,2.34,.99,0,black);for(let i=0;i<5;i++)box(.025,.035,.87,2.41,.86+i*.06,0,chrome,false);box(.17,.18,1.99,2.34,.62,0,black);box(.17,.18,1.99,-2.34,.62,0,black);box(.02,.12,.47,2.44,.63,0,material(0xf0f0e8),false);
function composite(o){o.ctx.fillStyle=o.base;o.ctx.fillRect(0,0,512,512);o.ctx.drawImage(o.dirt,0,0);o.ctx.drawImage(o.foam,0,0);o.tex.needsUpdate=true}
function reset(){seed=Date.now()>>>0;for(let o of washable){o.dc.clearRect(0,0,512,512);o.fc.clearRect(0,0,512,512);for(let i=0;i<1100;i++){let x=rand()*512,y=rand()*512,r=3+rand()*35;let gr=o.dc.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(86,52,28,'+(.35+rand()*.6)+')');gr.addColorStop(.7,'rgba(120,78,43,.55)');gr.addColorStop(1,'rgba(120,78,43,0)');o.dc.fillStyle=gr;o.dc.fillRect(x-r,y-r,r*2,r*2)}composite(o)}initial=measure();}function measure(){let sum=0;for(let o of washable){let d=o.dc.getImageData(0,0,512,512).data;for(let i=3;i<d.length;i+=256)sum+=d[i]}return sum}let initial=1;reset();
let az=.8,el=.35,dist=8.5,mode='water',down=false,lastX=0,lastY=0;const ray=new T.Raycaster(),pointer=new T.Vector2();let hit=null;const jet=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3()]),new T.LineBasicMaterial({color:0xc7f5ff,transparent:true,opacity:.8}));scene.add(jet);jet.visible=false;let particles=new T.BufferGeometry(),positions=new Float32Array(180*3);particles.setAttribute('position',new T.BufferAttribute(positions,3));let spray=new T.Points(particles,new T.PointsMaterial({color:0xe5faff,size:.035,transparent:true,opacity:.65}));scene.add(spray);spray.visible=false;
function brush(ctx,x,y,r,erase){ctx.globalCompositeOperation=erase?'destination-out':'source-over';let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,erase?'rgba(0,0,0,.32)':'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalCompositeOperation='source-over'}
let cv=renderer.domElement;cv.onpointerdown=e=>{down=true;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(down&&mode==='orbit'){az-=(e.clientX-lastX)*.009;el=Math.max(.05,Math.min(1.45,el+(e.clientY-lastY)*.009))}lastX=e.clientX;lastY=e.clientY};cv.onpointerup=cv.onpointercancel=()=>down=false;cv.onwheel=e=>{dist=Math.max(4,Math.min(13,dist+e.deltaY*.008));e.preventDefault()};for(let k of ['water','foam','orbit'])document.getElementById(k).onclick=()=>{mode=k;for(let j of ['water','foam','orbit'])document.getElementById(j).classList.toggle('active',j===k)};document.getElementById('reset').onclick=reset;
let frame=0;function animate(){requestAnimationFrame(animate);camera.position.set(Math.cos(az)*Math.cos(el)*dist,1+Math.sin(el)*dist,Math.sin(az)*Math.cos(el)*dist);camera.lookAt(0,1.1,0);camera.updateMatrixWorld();jet.visible=spray.visible=false;if(down&&mode!=='orbit'){pointer.set(lastX/innerWidth*2-1,1-lastY/innerHeight*2);ray.setFromCamera(pointer,camera);hit=ray.intersectObjects(car.children,false)[0];if(hit&&hit.uv){let o=washable.find(o=>o.mesh===hit.object);if(o){let x=hit.uv.x*512,y=(1-hit.uv.y)*512;if(mode==='water'){brush(o.dc,x,y,36,true);brush(o.fc,x,y,42,true)}else brush(o.fc,x,y,48,false);composite(o)}let start=camera.position.clone().add(new T.Vector3(.7,-.7,0));jet.geometry.attributes.position.setXYZ(0,start.x,start.y,start.z);jet.geometry.attributes.position.setXYZ(1,hit.point.x,hit.point.y,hit.point.z);jet.geometry.attributes.position.needsUpdate=true;jet.frustumCulled=false;jet.visible=true;for(let i=0;i<180;i++){let t=Math.random(),p=start.clone().lerp(hit.point,t),r=.025+t*.09;if(i>130){p.copy(hit.point);r=.22}positions[i*3]=p.x+(Math.random()-.5)*r;positions[i*3+1]=p.y+(Math.random()-.5)*r;positions[i*3+2]=p.z+(Math.random()-.5)*r}particles.attributes.position.needsUpdate=true;spray.frustumCulled=false;spray.visible=true}}if(frame++%45===0){let p=Math.min(100,Math.max(0,Math.round(100*(1-measure()/initial))));document.getElementById('pct').textContent=p+'%';document.getElementById('progress').value=p}renderer.render(scene,camera)}animate();document.getElementById('status').remove();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script><script>setTimeout(()=>{let s=document.getElementById('status');if(s)s.textContent='3D 未能載入，請檢查網絡及 WebGL 支援，然後重新整理。'},12000)</script></html>
