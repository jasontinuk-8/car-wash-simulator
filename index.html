<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Car Wash Simulator</title><style>*{box-sizing:border-box}body{margin:0;background:#101a23;color:#fff;font:16px system-ui;overflow:hidden}header{z-index:2;position:absolute;top:0;left:0;right:0;padding:16px;pointer-events:none}h1{font-size:22px;margin:0}small{color:#b6c9d6}#bar{height:7px;background:#ffffff30;border-radius:9px;max-width:350px;margin-top:8px}#fill{height:100%;background:#65e5b4;border-radius:9px}canvas{position:absolute;inset:0;z-index:0;display:block;touch-action:none}footer{z-index:2;position:absolute;bottom:0;left:0;right:0;padding:12px 8px max(12px,env(safe-area-inset-bottom));background:#101a23dd;text-align:center}button{background:#263b4c;color:white;border:1px solid #567084;border-radius:12px;padding:12px 14px;margin:3px;font:inherit}button.active{background:#157b9c;border-color:#8ceaff}#hint{font-size:13px;color:#c2d3df;margin:4px}#done{color:#65e5b4;font-weight:bold}#error{position:absolute;top:40%;padding:20px}</style><body><header><h1>CAR WASH <small>洗車模擬器</small></h1><div>清潔度 <b id="pct">0%</b> <span id="done"></span></div><div id="bar"><div id="fill" style="width:0%"></div></div></header><footer><button id="water" class="active">🚿 水槍</button><button id="foam">🫧 泡沫</button><button id="orbit">↔ 轉動</button><button id="reset">重新開始</button><div id="hint">按住車身拖動沖洗 · 選擇轉動查看另一面</div></footer><div id="error" style="top:28%;left:0;right:0;text-align:center"><svg viewBox="0 0 320 150" width="85%" style="max-width:420px"><path fill="#795338" stroke="#362a23" stroke-width="3" d="M20 105V65L65 60 95 20H215L250 60 300 70V110H20Z"/><path fill="#7695a4" d="M100 28H153V60H78ZM163 28H210L237 60H163Z"/><circle cx="75" cy="108" r="27" fill="#222"/><circle cx="245" cy="108" r="27" fill="#222"/><circle cx="75" cy="108" r="13" fill="#aaa"/><circle cx="245" cy="108" r="13" fill="#aaa"/></svg><p>如果只見到呢架靜態車，代表預覽未執行 JavaScript。請用完整瀏覽器開啟遊戲。</p></div><script>(function(){let started=false;function start(){if(started||document.querySelector('canvas'))return;started=true;const c=document.createElement('canvas');document.body.prepend(c);const g=c.getContext('2d');let a=.65,e=.35,mode='water',down=false,px=0,py=0,faces=[],visible=[],total=0;function face(v,col){let dirt=Array.from({length:144},()=>Math.random()*.65+.3);faces.push({v,col,dirt,foam:Array(144).fill(0)});}function box(x,y,z,w,h,d,col){let v=[[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z],[x,y,z+d],[x+w,y,z+d],[x+w,y+h,z+d],[x,y+h,z+d]];for(let f of [[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[3,7,6,2],[0,1,5,4]])face(f.map(i=>v[i]),col);}box(-2.3,.55,-1,4.6,1,2,'#268ca8');box(-1.65,1.55,-.91,2.55,.8,1.82,'#31586e');box(-1.75,2.35,-1,2.75,.12,2,'#25849b');for(let z of [-1.02,.99]){for(let x of [-1.5,-.65,.2])box(x,1.68,z,.72,.52,.03,'#456b83');box(-1.9,.68,z,3.8,.13,.04,'#303b40');}for(let x of [-1.45,1.45])for(let z of [-1.08,1.08]){let zz=z-.22;for(let i=0;i<24;i++){let t=i*Math.PI/12,u=(i+1)*Math.PI/12;let p=(q,k,r)=>[x+Math.cos(q)*r,.63+Math.sin(q)*r,k];face([p(t,zz,.63),p(u,zz,.63),p(u,zz+.44,.63),p(t,zz+.44,.63)],'#24282c');for(let k of [zz,zz+.44]){face([[x,.63,k],p(t,k,.63),p(u,k,.63),[x,.63,k]],'#303438');face([[x,.63,k+(k===zz?-.01:.01)],p(t,k+(k===zz?-.01:.01),.36),p(u,k+(k===zz?-.01:.01),.36),[x,.63,k+(k===zz?-.01:.01)]],'#aeb9bf');}}}for(let z of [-.8,.4]){box(2.3,1.1,z,.05,.32,.4,'#e5eee7');box(-2.35,1.1,z,.05,.32,.4,'#bc3333');}box(2.31,.65,-.65,.08,.35,1.3,'#30363b');function reset(){total=0;for(let f of faces){f.dirt=f.dirt.map(()=>Math.random()*.65+.3);f.foam.fill(0);total+=f.dirt.reduce((a,b)=>a+b,0);}}reset();function resize(){c.width=innerWidth;c.height=innerHeight;}resize();addEventListener('resize',resize);function project(v){let [x,y,z]=v;let X=x*Math.cos(a)-z*Math.sin(a),Z=x*Math.sin(a)+z*Math.cos(a);let Y=(y-1.15)*Math.cos(e)-Z*Math.sin(e),D=Z*Math.cos(e)+(y-1.15)*Math.sin(e);let s=Math.min(c.width/6.3,(Math.max(100,c.height-150))/4.2);return [c.width/2+X*s,c.height*.46-Y*s,D];}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.closePath();g.fill();}function mix(p,u,v){return p[0].map((_,k)=>(1-v)*((1-u)*p[0][k]+u*p[1][k])+v*((1-u)*p[3][k]+u*p[2][k]));}function inside(p,x,y){let b=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>y)!=(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])b=!b;}return b;}function draw(){let bg=g.createLinearGradient(0,0,0,c.height);bg.addColorStop(0,'#a8bac6');bg.addColorStop(1,'#43535e');g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.fillStyle='#26343b66';g.beginPath();g.ellipse(c.width/2,c.height*.65,Math.min(c.width*.36,240),35,0,0,7);g.fill();visible=faces.map(f=>({f,p:f.v.map(project)})).sort((a,b)=>a.p.reduce((s,v)=>s+v[2],0)-b.p.reduce((s,v)=>s+v[2],0));for(let {f,p} of visible){poly(p,f.col);for(let j=0;j<12;j++)for(let i=0;i<12;i++){let k=j*12+i,q=[mix(p,i/12,j/12),mix(p,(i+1)/12,j/12),mix(p,(i+1)/12,(j+1)/12),mix(p,i/12,(j+1)/12)];poly(q,`rgba(105,69,39,${f.dirt[k]})`);if(f.foam[k])poly(q,`rgba(250,253,255,${f.foam[k]})`);}}if(down&&mode!=='orbit'){for(let {f,p} of [...visible].reverse()){if(!inside(p,px,py))continue;for(let j=0;j<12;j++)for(let i=0;i<12;i++){let q=mix(p,(i+.5)/12,(j+.5)/12),k=j*12+i,w=Math.max(0,1-Math.hypot(q[0]-px,q[1]-py)/35);if(mode==='foam')f.foam[k]=Math.min(.95,f.foam[k]+w*.12);else{f.dirt[k]=Math.max(0,f.dirt[k]-w*.055);f.foam[k]=Math.max(0,f.foam[k]-w*.1);}}break;}g.strokeStyle='#d8f8ffbb';g.lineWidth=3;g.beginPath();g.moveTo(c.width*.85,c.height*.8);g.lineTo(px,py);g.stroke();for(let i=0;i<25;i++){g.fillStyle='#e1faffaa';g.fillRect(px+(Math.random()-.5)*65,py+(Math.random()-.5)*65,2,3);}}let left=faces.reduce((s,f)=>s+f.dirt.reduce((a,b)=>a+b,0),0),p=Math.max(0,Math.floor(100*(1-left/total)));document.getElementById('pct').textContent=p+'%';document.getElementById('fill').style.width=p+'%';requestAnimationFrame(draw);}for(let k of ['water','foam','orbit'])document.getElementById(k).onclick=()=>{mode=k;for(let j of ['water','foam','orbit'])document.getElementById(j).classList.toggle('active',j===k);};document.getElementById('reset').onclick=reset;c.onpointerdown=t=>{down=true;px=t.clientX;py=t.clientY;c.setPointerCapture(t.pointerId);};c.onpointermove=t=>{if(down&&mode==='orbit'){a+=(t.clientX-px)*.012;e=Math.max(-.15,Math.min(1.4,e+(t.clientY-py)*.009));}px=t.clientX;py=t.clientY;};c.onpointerup=c.onpointercancel=()=>down=false;draw();document.getElementById("error").remove();}window.addEventListener('error',()=>setTimeout(start,100));start();})();
</script></body></html>
